<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>FLA 手机投屏</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font:14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
header{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#000}
header b{flex:1;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:#777}.dot.on{background:#4caf50}
.tabs{display:flex;background:#222;border-radius:8px;padding:2px}
.tabs button{border:0;background:none;color:#aaa;padding:5px 10px;border-radius:6px;font-size:13px}
.tabs button.on{background:#fff;color:#111}
#stage{position:absolute;top:44px;bottom:118px;left:0;right:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
#img{display:block;max-width:100vw;max-height:calc(100vh - 162px);background:#000}
#ink{position:absolute;left:0;top:0}
#wait{position:absolute;color:#888;text-align:center;padding:20px}
footer{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#111;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
.row{display:flex;justify-content:space-around;align-items:center}
.tb{border:0;background:none;width:44px;height:44px;border-radius:10px;font-size:20px;color:#111;display:flex;align-items:center;justify-content:center}
.tb.on{background:#111;color:#fff}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop{position:absolute;left:8px;right:8px;bottom:124px;background:#fff;color:#111;border-radius:12px;padding:12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.pop.on{display:block}
.pop h4{margin:4px 0 8px;font-size:13px;color:#555;font-weight:500}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:0 6px 6px 0;border:1px solid #bbb}
.sw.on{outline:3px solid #1e88e5;outline-offset:1px}
.seg{display:flex;background:#eee;border-radius:8px;padding:2px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:6px;font-size:13px}
.seg button.on{background:#111;color:#fff}
#castPane{position:absolute;top:44px;bottom:0;left:0;right:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#castPane video{max-width:100%;max-height:55vh;background:#000;border-radius:10px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;background:#fff;color:#111;min-width:200px}
.btn.dark{background:#333;color:#fff}
#pair{position:fixed;inset:0;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pair input{font-size:28px;letter-spacing:10px;text-align:center;width:200px;padding:10px;border-radius:10px;border:0}
#msg{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#111;padding:8px 14px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><b>FLA 手机投屏</b>
  <div class="tabs"><button id="tWatch" class="on">观看电脑</button><button id="tCast">投屏到电脑</button></div>
</header>

<div id="stage"><div id="wrap"><img id="img" alt=""><canvas id="ink"></canvas></div><div id="wait">正在连接电脑画面…</div></div>

<div class="pop" id="penPop">
  <h4>颜色</h4><div id="colors"></div>
  <h4>粗细</h4><div class="seg" id="widths"><button data-w="0.003">细</button><button data-w="0.006">中</button><button data-w="0.012">粗</button></div>
</div>
<div class="pop" id="erPop">
  <h4>橡皮类型</h4><div class="seg" id="erMode"><button data-m="object">对象橡皮</button><button data-m="pixel">像素橡皮</button></div>
  <h4>大小</h4><div class="seg" id="erSize"><button data-r="0.01">小</button><button data-r="0.025">中</button><button data-r="0.05">大</button></div>
  <div class="seg"><button id="clearAll">清除本页全部笔迹</button></div>
</div>

<footer id="bar">
  <div class="row">
    <button class="tb" data-act="prev" title="上一页"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="tb" data-act="next" title="下一页"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="tb" data-act="black" title="黑屏"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2"/></svg></button>
    <button class="tb" data-act="board" title="白板"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg></button>
    <button class="tb" data-act="undo" title="撤销"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="tb" data-act="clear" title="清屏"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  </div>
  <div class="row">
    <button class="tb on" data-tool="view" title="仅观看"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="tb" data-tool="pen" title="画笔"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="tb" data-tool="marker" title="荧光笔"><svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg></button>
    <button class="tb" data-tool="laser" title="激光笔"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="tb" data-tool="eraser" title="橡皮"><svg viewBox="0 0 24 24"><path d="M20 20H7L3 16a2 2 0 010-2.8L13.2 3a2 2 0 012.8 0L21 8a2 2 0 010 2.8L11 20"/></svg></button>
  </div>
</footer>

<div id="castPane">
  <video id="video" playsinline muted></video>
  <button class="btn" id="camBtn">开启摄像头投屏</button>
  <button class="btn dark" id="flipBtn" style="display:none">切换前/后摄像头</button>
  <label class="btn dark" style="text-align:center">拍照 / 选图片投屏<input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
  <button class="btn dark" id="stopCast" style="display:none">停止投屏</button>
  <div id="castTip" style="color:#999;font-size:13px;text-align:center"></div>
</div>

<div id="pair"><div style="font-size:16px">输入大屏上显示的 4 位配对码</div><input id="pairInput" inputmode="numeric" maxlength="4"><button class="btn" id="pairBtn">连接</button></div>
<div id="msg"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search), sid = q.get('sid'), code = q.get('code');
  var $ = function (id) { return document.getElementById(id); };
  function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { m.style.display = 'none'; }, 2200); }
  function api(path, opt) { return fetch(path, opt); }
  function action(a, data) {
    return api('/api/remote/' + sid + '/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: a, data: data || {} }) }).catch(function () {});
  }

  if (!sid || !code) {
    $('pair').style.display = 'flex';
    $('pairBtn').onclick = function () {
      var c = $('pairInput').value.trim();
      fetch('/api/remote/pair/' + encodeURIComponent(c)).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) { location.replace('cast.html?sid=' + d.session_id + '&code=' + c); })
        .catch(function () { toast('配对码无效，请确认电脑已开启手机投屏'); });
    };
    return;
  }

  /* ---------- 观看: 拉取电脑画面 ---------- */
  var img = $('img'), seq = 0, alive = true, lastOk = 0, url = null;
  function pull() {
    if (!alive) return;
    if (document.hidden || mode !== 'watch') { setTimeout(pull, 800); return; }
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 15000);
    fetch('/api/remote/' + sid + '/frame/pc?code=' + code + '&after=' + seq, { signal: ctl.signal, cache: 'no-store' })
      .then(function (r) {
        clearTimeout(t);
        if (r.status === 404) { alive = false; $('wait').textContent = '投屏已结束'; $('wait').style.display = 'block'; return; }
        if (r.status === 403) { alive = false; $('wait').textContent = '配对码错误'; return; }
        lastOk = Date.now();
        if (r.status === 204) { setTimeout(pull, 300); return; }
        seq = parseInt(r.headers.get('X-Seq') || seq + 1, 10);
        return r.blob().then(function (b) {
          var u = URL.createObjectURL(b);
          img.onload = function () { if (url) URL.revokeObjectURL(url); url = u; $('wait').style.display = 'none'; fit(); pull(); };
          img.onerror = function () { setTimeout(pull, 500); };
          img.src = u;
        });
      })
      .catch(function () { clearTimeout(t); setTimeout(pull, 1500); });
  }
  setInterval(function () { $('dot').className = 'dot' + (Date.now() - lastOk < 4000 ? ' on' : ''); }, 1000);
  action('hello_phone');

  /* ---------- 批注 ---------- */
  var ink = $('ink'), ctx = ink.getContext('2d');
  var tool = 'view', color = '#E53935', width = 0.003, erMode = 'object', erR = 0.025;
  function fit() {
    var r = img.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    ink.style.width = r.width + 'px'; ink.style.height = r.height + 'px';
    ink.width = r.width * d; ink.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', fit);
  function norm(e) {
    var r = ink.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
  }
  var cur = null, buf = [], flushT = null, lastLaser = 0, lastErase = 0;
  function flush(end) {
    if (!cur) return;
    if (buf.length || end) action('ink', { id: cur.id, tool: cur.tool, color: cur.color, w: cur.w, pts: buf, end: !!end });
    buf = [];
  }
  function drawLocal() {
    var r = ink.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    if (!cur) return;
    ctx.strokeStyle = cur.color; ctx.globalAlpha = cur.tool === 'marker' ? 0.35 : 1;
    ctx.lineWidth = Math.max(1.5, cur.w * r.width * (cur.tool === 'marker' ? 3 : 1)); ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    cur.all.forEach(function (p, i) { var x = p[0] * r.width, y = p[1] * r.height; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  ink.addEventListener('pointerdown', function (e) {
    if (tool === 'view') return;
    ink.setPointerCapture(e.pointerId);
    var p = norm(e);
    if (tool === 'pen' || tool === 'marker') {
      cur = { id: Math.random().toString(36).slice(2, 10), tool: tool, color: color, w: tool === 'marker' ? width * 3 : width, all: [p] };
      buf = [p]; flushT = setInterval(function () { flush(false); }, 90);
    } else if (tool === 'laser') { action('laser', { x: p[0], y: p[1] }); }
    else if (tool === 'eraser') { action('erase', { x: p[0], y: p[1], r: erR, mode: erMode }); }
  });
  ink.addEventListener('pointermove', function (e) {
    if (tool === 'view' || !e.buttons && e.pointerType === 'mouse') return;
    var p = norm(e), now = Date.now();
    if (cur) { cur.all.push(p); buf.push([+p[0].toFixed(4), +p[1].toFixed(4)]); drawLocal(); }
    else if (tool === 'laser' && now - lastLaser > 50) { lastLaser = now; action('laser', { x: p[0], y: p[1] }); }
    else if (tool === 'eraser' && now - lastErase > 60) { lastErase = now; action('erase', { x: p[0], y: p[1], r: erR, mode: erMode }); }
  });
  function up() {
    if (!cur) return;
    clearInterval(flushT); flush(true);
    var done = cur; setTimeout(function () { if (cur === done || !cur) { cur = null; drawLocal(); } }, 1600);
    cur = null; setTimeout(drawLocal, 1600);
  }
  ink.addEventListener('pointerup', up); ink.addEventListener('pointercancel', up);

  /* ---------- 工具栏 ---------- */
  var COLORS = ['#111111', '#E53935', '#1E88E5', '#43A047', '#FDD835', '#FB8C00', '#8E24AA', '#FFFFFF'];
  COLORS.forEach(function (c) {
    var s = document.createElement('span'); s.className = 'sw' + (c === color ? ' on' : ''); s.style.background = c;
    s.onclick = function () { color = c; [].forEach.call($('colors').children, function (x) { x.classList.remove('on'); }); s.classList.add('on'); };
    $('colors').appendChild(s);
  });
  function seg(id, attr, init, cb) {
    [].forEach.call($(id).children, function (b) {
      if (b.dataset[attr] == init) b.classList.add('on');
      b.onclick = function () { [].forEach.call($(id).children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); cb(b.dataset[attr]); };
    });
  }
  seg('widths', 'w', '0.003', function (v) { width = parseFloat(v); });
  seg('erMode', 'm', 'object', function (v) { erMode = v; });
  seg('erSize', 'r', '0.025', function (v) { erR = parseFloat(v); });
  $('clearAll').onclick = function () { action('clear'); $('erPop').classList.remove('on'); };
  [].forEach.call(document.querySelectorAll('[data-tool]'), function (b) {
    b.onclick = function () {
      var t = b.dataset.tool, again = t === tool;
      tool = t;
      [].forEach.call(document.querySelectorAll('[data-tool]'), function (x) { x.classList.toggle('on', x === b); });
      var pop = (t === 'pen' || t === 'marker') ? $('penPop') : t === 'eraser' ? $('erPop') : null;
      [$('penPop'), $('erPop')].forEach(function (p) { if (p !== pop) p.classList.remove('on'); });
      if (pop) pop.classList.toggle('on', again ? !pop.classList.contains('on') : true);
      ink.style.pointerEvents = t === 'view' ? 'none' : 'auto';
    };
  });
  ink.style.pointerEvents = 'none';
  [].forEach.call(document.querySelectorAll('[data-act]'), function (b) {
    b.onclick = function () { action(b.dataset.act); };
  });

  /* ---------- 投屏到电脑 ---------- */
  var mode = 'watch', stream = null, facing = 'environment', sending = false, camTimer = null;
  var cv = document.createElement('canvas');
  function setMode(m) {
    mode = m;
    $('tWatch').classList.toggle('on', m === 'watch'); $('tCast').classList.toggle('on', m === 'cast');
    $('stage').style.display = $('bar').style.display = m === 'watch' ? '' : 'none';
    $('castPane').style.display = m === 'cast' ? 'flex' : 'none';
    $('penPop').classList.remove('on'); $('erPop').classList.remove('on');
  }
  $('tWatch').onclick = function () { setMode('watch'); };
  $('tCast').onclick = function () { setMode('cast'); };
  function upload(blob) {
    sending = true;
    return api('/api/remote/' + sid + '/frame/phone?code=' + code, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
      .then(function (r) { if (!r.ok) throw 0; $('castTip').textContent = '已投到大屏 ' + new Date().toLocaleTimeString(); })
      .catch(function () { $('castTip').textContent = '上传失败，正在重试…'; })
      .then(function () { sending = false; });
  }
  function drawTo(src, w, h) {
    var s = Math.min(1, 1280 / Math.max(w, h)); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
    cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
    return new Promise(function (res) { cv.toBlob(res, 'image/jpeg', 0.6); });
  }
  function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('此浏览器不支持摄像头（请用 HTTPS 打开，或改用拍照投屏）'); return; }
    stopCam(true);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 } }, audio: false }).then(function (s) {
      stream = s; var v = $('video'); v.srcObject = s; v.play();
      $('camBtn').style.display = 'none'; $('flipBtn').style.display = $('stopCast').style.display = '';
      action('cast_start');
      camTimer = setInterval(function () {
        if (sending || !v.videoWidth) return;
        drawTo(v, v.videoWidth, v.videoHeight).then(function (b) { if (b) upload(b); });
      }, 350);
    }).catch(function () { toast('无法打开摄像头，请允许浏览器使用摄像头'); });
  }
  function stopCam(silent) {
    clearInterval(camTimer); camTimer = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null;
    $('camBtn').style.display = ''; $('flipBtn').style.display = 'none';
    if (!silent) { $('stopCast').style.display = 'none'; action('cast_stop'); }
  }
  $('camBtn').onclick = startCam;
  $('flipBtn').onclick = function () { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
  $('stopCast').onclick = function () { stopCam(false); };
  $('photo').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var im = new Image(); im.onload = function () {
      drawTo(im, im.naturalWidth, im.naturalHeight).then(function (b) { action('cast_start'); upload(b); $('stopCast').style.display = ''; });
      URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(f); e.target.value = '';
  };

  setMode('watch');
  pull();
})();
</script>
</body>
</html>
