services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fla
    restart: unless-stopped
    command: ["sh", "-c", "exec uvicorn server.main:app --host 0.0.0.0 --port \"$${PORT:-8306}\" --workers 1 --proxy-headers --forwarded-allow-ips '*'"]
    ports:
      - "${PORT:-8306}:${PORT:-8306}"
    environment:
      - PORT=${PORT:-8306}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APP_INTERNAL_URL=http://app:${PORT:-8306}
    volumes:
      - fla-data:/data
      - ../web:/app/web
      - ../server:/app/server
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # OnlyOffice 文档服务器: Office 文档原样查看与动画放映 (默认启用微软在线渲染, 此处仅按需 profiles: ds)
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: fla-onlyoffice
    profiles: ["ds"]
    restart: unless-stopped
    ports:
      - "${DS_PORT:-8880}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
      - TZ=Asia/Hong_Kong
    mem_limit: 2300m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  fla-data:
    name: fla-data
