services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fla
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-/ds}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APP_INTERNAL_URL=http://app:8000
    volumes:
      - fla-data:/data
      - ../web:/app/web
      - ../server:/app/server
    mem_limit: 1200m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # OnlyOffice 文档服务器: Office 文档原样查看与动画放映
  # (若内存吃紧或不需要动画, 可用 deploy/docker-compose.lite.yml)
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: fla-onlyoffice
    profiles: ["ds"]
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
      - TZ=Asia/Hong_Kong
    mem_limit: 2300m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8306}:80"
    environment:
      - FLA_MODE=full
    depends_on:
      - app
    mem_limit: 200m

volumes:
  fla-data:
    name: fla-data
