# 云讲台 - Nginx HTTPS 反向代理示例
# 放到 /etc/nginx/conf.d/edu-board.conf, 证书可用 certbot 免费签发:
#   certbot --nginx -d your.domain.com
server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.domain.com;

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;

    client_max_body_size 1024m;   # 允许大文件上传
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080/;   # compose 里把 PORT 改为 8080, 80/443 让给 nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;        # 音视频 Range 请求
    }
}
