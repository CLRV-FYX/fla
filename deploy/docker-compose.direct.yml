# FLA 直连备用模式: app 直接发布端口, 不经 nginx (install.sh 在 nginx 模式失败时自动切换)
# 完整直连时 OnlyOffice 也直接发布端口, 由 install.sh 以 --profile full 启用
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fla
    restart: unless-stopped
    ports:
      - "${PORT:-8306}:8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APP_INTERNAL_URL=${APP_INTERNAL_URL:-http://127.0.0.1:8000}
    volumes:
      - fla-data:/data
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  documentserver:
    profiles: ["full"]
    image: onlyoffice/documentserver:latest
    container_name: fla-onlyoffice
    restart: unless-stopped
    ports:
      - "${DS_PORT:-8880}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
      - TZ=Asia/Hong_Kong
    mem_limit: 2300m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  fla-data:
    name: fla-data
