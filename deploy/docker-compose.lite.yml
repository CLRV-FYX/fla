# FLA 精简版: 无 OnlyOffice(无动画放映), 适合小内存服务器; 其余功能完全一致
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fla
    restart: unless-stopped
    command: ["sh", "-c", "exec uvicorn server.main:app --host 0.0.0.0 --port \"$${PORT:-8306}\" --workers 1 --proxy-headers --forwarded-allow-ips '*'"]
    ports:
      - "${PORT:-8306}:${PORT:-8306}"
    environment:
      - PORT=${PORT:-8306}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APP_INTERNAL_URL=http://app:${PORT:-8306}
    volumes:
      - fla-data:/data
      - ../web:/app/web
      - ../server:/app/server
      - ../desktop:/app/desktop
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  fla-data:
    name: fla-data
