# FLA 精简版: 无 OnlyOffice(无动画放映), 适合小内存服务器; 其余功能完全一致
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: fla
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - APP_INTERNAL_URL=${APP_INTERNAL_URL:-http://app:8000}
    volumes:
      - fla-data:/data
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8306}:80"
    environment:
      - FLA_MODE=lite
    depends_on:
      - app
    mem_limit: 200m

volumes:
  fla-data:
    name: fla-data
